packages:
  - packages/*
  - examples/*
  - examples/tui/*
  - vendors/kkrpc/packages/kkrpc
  - docs
  - slides
  - learn

catalog:
  kkrpc: ^2.0.0
  react: ^19.2.4
  # react-dom must resolve to the exact same version as react — react-dom throws
  # "Incompatible React versions" at import time otherwise. Cataloguing it keeps
  # the two pinned together from one place.
  react-dom: ^19.2.4
  react-reconciler: ^0.33.0
